<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>8 绳冗余绳驱并联机器人 · 仿真平台</title>
  <!-- 禁止请求 favicon.ico（会 404 告警）；只托管 web/sim/firmware/docs/build 目录 -->
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css?v=74" />
</head>
<body>
<header id="topbar">
  <div class="brand">
    <span class="logo">CDPR</span>
    <span class="t1">8 绳冗余绳驱并联机器人仿真平台</span>
    <span class="t2">STM32F407ZGT6 + 86 步进电机 + HBS860H + 绳索机器人</span>
  </div>
  <div class="status">
    <span id="runState" class="pill">初始化中</span>
    <span id="simClock" class="pill mono">t = 0.000 s</span>
    <span id="fps" class="pill mono">-- fps</span>
    <span id="rateBadge" class="pill mono">×1.0</span>
  </div>
</header>

<main id="layout">
  <section id="viewport">
    <canvas id="gl"></canvas>
    <div id="overlayHud">
      <div><b>位姿</b> <span id="hudPose" class="mono">-</span></div>
      <div><b>目标</b> <span id="hudTarget" class="mono">-</span></div>
      <div><b>可行性</b> <span id="hudFeasible">-</span></div>
    </div>
    <div id="viewBtns">
      <button data-view="iso" title="等轴视图">等轴</button>
      <button data-view="front">正面</button>
      <button data-view="side">侧面</button>
      <button data-view="top">俯视</button>
    </div>
  </section>

  <aside id="sidebar">
    <div class="card">
      <h3>运行</h3>
      <div class="row">
        <button id="btnPause" class="primary">暂停</button>
        <button id="btnReset">复位</button>
        <label class="rate">倍率
          <input id="simRate" type="range" min="0.1" max="4" step="0.1" value="1" />
          <span id="simRateVal" class="mono">1.0×</span>
        </label>
      </div>
      <div class="row small">数据源：<select id="mode"><option value="js">JS 仿真（含参数读写与预览）</option><option value="fw">STM32 固件 · 无板仿真（无实时时钟）</option></select></div>
    </div>

    <div class="card">
      <h3>运动控制</h3>
      <div class="row wrap" id="poseBtns"></div>
      <div class="row">
        <button data-traj="circle">圆轨迹 + 姿态</button>
        <button data-traj="palletize">码垛取放</button>
        <button data-traj="hold">原位保持</button>
      </div>
      <div class="row small muted">视频演示：参考样机动作</div>
      <div class="row wrap">
        <button data-demo="translate" title="平面圆周平移，升降 + 旋转">平移巡游</button>
        <button data-demo="attitude" title="滚动 + 偏航姿态演示，参考样机动作">姿态演示</button>
        <button data-demo="circle" title="圆周 + 偏航姿态">圆周运动</button>
        <button data-demo="fast" title="快速直线往返">快速往返</button>
        <button data-demo="toss" title="垂直抛接网球，参考视频 2 的几个抛接">抛接动作</button>
        <button data-demo="stop">停止演示</button>
      </div>
      <div class="row small">
        附加负载 <input id="load" type="range" min="0" max="10" step="0.5" value="0" />
        <span id="loadVal" class="mono">0.0 kg</span>
      </div>
    </div>

    <div class="card">
      <h3>目标坐标（规划）</h3>
      <div class="axisGrid">
        <label>x (m)<input id="ptX" type="number" step="0.01" value="0.00" /></label>
        <label>y (m)<input id="ptY" type="number" step="0.01" value="0.60" /></label>
        <label>z (m)<input id="ptZ" type="number" step="0.01" value="0.00" /></label>
      </div>
      <div class="axisGrid">
        <label>roll<input id="ptR" type="number" step="0.05" value="0.00" /></label>
        <label>pitch<input id="ptP" type="number" step="0.05" value="0.00" title="严格 8 角拓扑下俯仰不可控，量力而行" /></label>
        <label>yaw<input id="ptW" type="number" step="0.05" value="0.00" /></label>
      </div>
      <div class="row">
        <button id="btnAddPt">加入路径</button>
        <button id="btnGoPt" class="primary">单点移动</button>
        <button id="btnRunSeq">走完全程</button>
        <button id="btnClearPt">清空</button>
      </div>
      <div class="row small muted">路径点（点名字填回输入框）</div>
      <div id="ptList"></div>
      <div class="row small" style="margin-top:6px">
        <label><input type="checkbox" id="seqLoop" /> 循环</label>
        <label class="rate">速度 <input id="seqSpeed" type="range" min="0.3" max="2.5" step="0.1" value="1" />
          <span id="seqSpeedVal" class="mono">1.0×</span></label>
      </div>
    </div>

    <div class="card">
      <h3>任务空间 PID</h3>
      <div class="row small">
        <label><input type="checkbox" id="pidEnable" /> 启用 PID（对位姿闭环）</label>
      </div>
      <div class="gainGrid">
        <span class="hdr"></span><span class="hdr">Kp</span><span class="hdr">Ki</span><span class="hdr">Kd</span>
        <span class="hdr">平移</span>
        <input id="pidTkp" type="number" step="10" value="400" />
        <input id="pidTki" type="number" step="1" value="40" />
        <input id="pidTkd" type="number" step="1" value="30" />
        <span class="hdr">姿态</span>
        <input id="pidRkp" type="number" step="0.5" value="6" />
        <input id="pidRki" type="number" step="0.1" value="1.2" />
        <input id="pidRkd" type="number" step="0.1" value="0.8" />
      </div>
      <div class="row"><button id="btnPidApply">应用增益</button></div>
      <div class="row small muted" id="pidDiag">PID 未启用</div>
    </div>

    <div class="card">
      <h3>张力分配</h3>
      <div class="row small">
        <select id="alloc">
          <option value="2" selected>8 根绳最小二乘（默认，推荐）</option>
          <option value="1">最小二乘精确解（数值力学参考）</option>
          <option value="3">对称抬升式预紧（可控预研）</option>
          <option value="0">全零分配（仅自测用）</option>
        </select>
      </div>
      <div class="row small muted">张力范围 T ∈ [<span id="tmin">-</span>, <span id="tmax">-</span>] N</div>
    </div>

    <div class="card">
      <h3>显示</h3>
      <div class="row wrap">
        <label><input type="checkbox" id="showFrame" checked /> 框架</label>
        <label><input type="checkbox" id="showCables" checked /> 绳索</label>
        <label><input type="checkbox" id="showTarget" checked /> 目标位姿</label>
        <label><input type="checkbox" id="showForces" /> 张力矢量</label>
      </div>
      <div class="row small">
        着色 <select id="colorMode">
          <option value="tension">张力着色</option>
          <option value="plain">单色</option>
        </select>
      </div>
    </div>

    <div class="card logs">
      <h3>控制台 <button id="btnClearLog" class="mini">清空</button></h3>
      <div id="log"></div>
    </div>
  </aside>
</main>

<section id="bottom">
  <div class="charts">
    <div class="chartBox">
      <canvas id="chartT"></canvas>
      <div class="legend" id="legendT"></div>
    </div>
    <div class="chartBox">
      <canvas id="chartL"></canvas>
      <div class="legend" id="legendL"></div>
    </div>
  </div>
  <div class="motorPanel">
    <table id="motorTable">
      <thead><tr><th>序</th><th>T (N)</th><th>T*</th><th>l (m)</th><th>Δl (mm)</th><th>卷筒转矩</th><th>电机 r/min</th><th>电流 A</th><th>状态</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<script type="module" src="main.js?v=74"></script>
</body>
</html>
